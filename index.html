<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0b1220" />
<title>Water Sort Puzzle</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      -webkit-user-select:none; user-select:none; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#080d16;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    touch-action:none; overscroll-behavior:none;
  }
  #game { display:block; width:100%; height:100%; touch-action:none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
(() => {
'use strict';

/* ---------- 1. CANVAS ---------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const view = { w:0, h:0, dpr:1 };
let bgGradient = null;

/* ---------- 2. CONSTANTS ---------- */
const CAP = 4;
const SHAKE_DUR = 320;
const TOTAL_LEVELS = 9999;
const HINT_COST = 50;
const TUBE_COST = 100;
const MAX_TUBES = 10;
const WIN_COINS = 10;

const COLORS = [
  { key:'red',    hex:'#e53935' },
  { key:'green',  hex:'#2e7d32' },
  { key:'blue',   hex:'#1565c0' },
  { key:'yellow', hex:'#fbc02d' },
  { key:'purple', hex:'#7b1fa2' },
  { key:'orange', hex:'#f57c00' },
  { key:'cyan',   hex:'#4dd0e1' },
  { key:'pink',   hex:'#c2185b' },
  { key:'lime',   hex:'#8bc34a' }
];
/* Safer than Object.fromEntries — works everywhere */
const HEX = {};
COLORS.forEach(c => { HEX[c.key] = c.hex; });

/* ---------- 3. STATE ---------- */
let level = (() => {
  try {
    const saved = parseInt(localStorage.getItem('watersort_level'), 10);
    return (Number.isFinite(saved) && saved >= 1) ? Math.min(saved, TOTAL_LEVELS) : 1;
  } catch (e) { return 1; }
})();

/* Music preference (default ON). Saved under 'watersort_music'. */
let musicEnabled = (() => {
  try {
    const v = localStorage.getItem('watersort_music');
    return v === null ? true : (v === 'true' || v === '1');
  } catch (e) { return true; }
})();

/* SFX preference (default ON). Saved under 'watersort_sfx'. */
let sfxEnabled = (() => {
  try {
    const v = localStorage.getItem('watersort_sfx');
    return v === null ? true : (v === 'true' || v === '1');
  } catch (e) { return true; }
})();

/* ---------- 3b. COINS ---------- */
let coins = (() => {
  try {
    const v = parseInt(localStorage.getItem('watersort_coins'), 10);
    return (Number.isFinite(v) && v >= 0) ? v : 0;
  } catch (e) { return 0; }
})();
function saveCoins() {
  try { localStorage.setItem('watersort_coins', String(coins)); } catch (e) {}
}

/* ---------- 3c. SHOP STATE ---------- */
const SHOP_BGS = [
  { id: 'default', name: 'Midnight', cost: 0,    colors: ['#182338', '#0e1626', '#070c14'] },
  { id: 'sunset',  name: 'Sunset',   cost: 500,  colors: ['#2b1055', '#75225c', '#1e0b2d'] },
  { id: 'matrix',  name: 'Matrix',   cost: 1000, colors: ['#0a1c0e', '#051208', '#020603'] }
];
const SHOP_TUBES = [
  { id: 'default', name: 'Glass', cost: 0,    border: 'rgba(200,225,255,0.48)', fill: 'rgba(255,255,255,0.06)' },
  { id: 'neon',    name: 'Neon',  cost: 800,  border: '#ff007f',                fill: 'rgba(255,0,127,0.08)'   },
  { id: 'wood',    name: 'Wood',  cost: 1500, border: '#8b5a2b',                fill: 'rgba(139,90,43,0.15)'   }
];

let ownedBgs   = ['default'], activeBg   = 'default';
let ownedTubes = ['default'], activeTube = 'default';
let shopTab = 'bgs';                             // 'bgs' | 'tubes'
const shopUI = { tabs:{}, cards:[], backBtn:null };

/* ---------- 3d. SHOP PERSISTENCE ---------- */
function loadShopProgress() {
  try {
    const bgs = JSON.parse(localStorage.getItem('watersort_ownedBgs')   || 'null');
    if (Array.isArray(bgs) && bgs.length) ownedBgs = bgs;
    const tbs = JSON.parse(localStorage.getItem('watersort_ownedTubes') || 'null');
    if (Array.isArray(tbs) && tbs.length) ownedTubes = tbs;

    const ab = localStorage.getItem('watersort_activeBg');
    if (ab && SHOP_BGS.some(b => b.id === ab))     activeBg = ab;
    const at = localStorage.getItem('watersort_activeTube');
    if (at && SHOP_TUBES.some(t => t.id === at))   activeTube = at;
  } catch (e) {}

  // Ensure defaults are always present and active is owned
  if (!ownedBgs.includes('default'))   ownedBgs.push('default');
  if (!ownedTubes.includes('default')) ownedTubes.push('default');
  if (!ownedBgs.includes(activeBg))    activeBg = 'default';
  if (!ownedTubes.includes(activeTube))activeTube = 'default';
}

function saveShopProgress() {
  try {
    localStorage.setItem('watersort_ownedBgs',   JSON.stringify(ownedBgs));
    localStorage.setItem('watersort_ownedTubes', JSON.stringify(ownedTubes));
    localStorage.setItem('watersort_activeBg',   activeBg);
    localStorage.setItem('watersort_activeTube', activeTube);
  } catch (e) {}
}

/* Rebuild bgGradient from the currently-equipped background theme. */
function applyActiveBg() {
  if (!view.h) return;
  const bg = SHOP_BGS.find(b => b.id === activeBg) || SHOP_BGS[0];
  bgGradient = ctx.createLinearGradient(0, 0, 0, view.h);
  bgGradient.addColorStop(0,    bg.colors[0]);
  bgGradient.addColorStop(0.55, bg.colors[1]);
  bgGradient.addColorStop(1,    bg.colors[2]);
}

let gameState = 'MENU';          // 'MENU', 'LEVELS', 'PLAYING', 'SHOP'
let mapScroll = 0;               // level map scroll offset
let mapMaxScroll = 0;
let mapAutoScroll = false;       // LEVELS kholte waqt current level par scroll
let showHelp = false;            // HOW TO PLAY overlay (main menu)

let tubes = [];
let initialTubes = [];
let history = [];
let selected = -1;
let moves = 0;
let won = false;
let winProgress = 0;
let anim = null;
let shakeT = 0;
let shakeIndex = -1;
let particles = [];              // confetti + bubble particles

let hint = null;                 // { src, dst, t }  -> highlight for 2s
let toast = null;                // { text, t, dur } -> small message popup
let coinRewardT = 0;             // animation timer for "+10 COINS" on win screen
let rewardGranted = false;       // true only if this win actually paid coins

const layout = {
  tubes:[], undoBtn:null, resetBtn:null, nextBtn:null, replayBtn:null, musicBtn:null, sfxBtn:null,
  coinBar:null, hintBtn:null, extraBtn:null
};
const ui = { playBtn:null, levelsBtn:null, helpBtn:null, shopBtn:null, helpClose:null,
             backBtn:null, menuBtn:null, musicBtn:null, cells:[] };

/* Saved progress = highest unlocked level */
function getUnlocked() {
  try {
    const s = parseInt(localStorage.getItem('watersort_level'), 10);
    return (Number.isFinite(s) && s >= 1) ? Math.min(s, TOTAL_LEVELS) : 1;
  } catch (e) { return 1; }
}
function saveProgress() {
  const nxt = Math.min(level + 1, TOTAL_LEVELS);
  if (nxt > getUnlocked()) {
    try { localStorage.setItem('watersort_level', String(nxt)); } catch (e) {}
  }
}

/* ---------- 4. HELPERS ---------- */
const cloneTubes = arr => arr.map(t => t.slice());

function rr(c, x, y, w, h, r) {
  if (typeof c.roundRect === 'function') { c.roundRect(x, y, w, h, r); return; }
  r = Math.min(r, w/2, h/2);
  c.moveTo(x+r, y);
  c.arcTo(x+w, y,   x+w, y+h, r);
  c.arcTo(x+w, y+h, x,   y+h, r);
  c.arcTo(x,   y+h, x,   y,   r);
  c.arcTo(x,   y,   x+w, y,   r);
  c.closePath();
}
const easeInOutQuad = t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
function pointInRect(p, r) {
  return !!r && p.x >= r.x && p.x <= r.x+r.w && p.y >= r.y && p.y <= r.y+r.h;
}

/* Haptic feedback — safe on browsers without vibration support */
function vibrate(pattern) {
  if (navigator.vibrate) {
    try { navigator.vibrate(pattern); } catch (e) {}
  }
}

/* Word-wrap helper (uses the CURRENT ctx.font) */
function wrapText(text, maxW) {
  const words = String(text).split(' ');
  const lines = [];
  let line = '';
  for (let i = 0; i < words.length; i++) {
    const test = line ? line + ' ' + words[i] : words[i];
    if (line && ctx.measureText(test).width > maxW) {
      lines.push(line);
      line = words[i];
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

/* ---------- 4b. TOAST ---------- */
function showToast(text, dur) {
  toast = { text: String(text), t: 0, dur: dur || 2200 };
}

/* ============================================================
   4c. VECTOR ICON LIBRARY
   ============================================================ */

function drawCoinIcon(c, x, y, radius) {
  if (!(radius > 0)) return;
  c.save();
  c.shadowBlur = 0; c.shadowColor = 'transparent';
  c.lineJoin = 'round';

  const g = c.createRadialGradient(
    x - radius * 0.35, y - radius * 0.40, radius * 0.12,
    x, y, radius
  );
  g.addColorStop(0,   '#fff6bb');
  g.addColorStop(0.55,'#ffd60a');
  g.addColorStop(1,   '#e0a200');
  c.beginPath();
  c.arc(x, y, radius, 0, Math.PI * 2);
  c.fillStyle = g;
  c.fill();

  c.beginPath();
  c.arc(x, y, radius * 0.78, 0, Math.PI * 2);
  c.fillStyle = '#c98700';
  c.fill();

  c.beginPath();
  c.arc(x, y, radius * 0.60, 0, Math.PI * 2);
  c.fillStyle = '#ffd94a';
  c.fill();

  c.beginPath();
  c.arc(x, y, radius * 0.78, Math.PI * 1.02, Math.PI * 1.48);
  c.lineWidth = Math.max(1, radius * 0.16);
  c.lineCap = 'round';
  c.strokeStyle = 'rgba(255,255,255,0.55)';
  c.stroke();

  c.beginPath();
  c.arc(x, y, radius - Math.max(0.5, radius * 0.06), 0, Math.PI * 2);
  c.lineWidth = Math.max(1, radius * 0.12);
  c.strokeStyle = 'rgba(255,246,180,0.75)';
  c.stroke();

  c.restore();
}

function drawHintIcon(c, x, y, size) {
  if (!(size > 0)) return;
  const s = size;
  const R = s * 0.26;
  const cy = y - s * 0.10;

  c.save();
  c.shadowBlur = 0; c.shadowColor = 'transparent';
  c.lineCap = 'round';

  c.strokeStyle = '#ffd60a';
  c.lineWidth = Math.max(1.1, s * 0.075);
  const rIn = R * 1.36, rOut = R * 1.90;
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + (i - 2) * (Math.PI / 5);
    c.beginPath();
    c.moveTo(x + Math.cos(a) * rIn,  cy + Math.sin(a) * rIn);
    c.lineTo(x + Math.cos(a) * rOut, cy + Math.sin(a) * rOut);
    c.stroke();
  }

  const g = c.createRadialGradient(
    x - R * 0.32, cy - R * 0.36, R * 0.12,
    x, cy, R
  );
  g.addColorStop(0, '#fffbd0');
  g.addColorStop(1, '#ffd60a');
  c.beginPath();
  c.arc(x, cy, R, 0, Math.PI * 2);
  c.fillStyle = g;
  c.fill();
  c.lineWidth = Math.max(1, s * 0.045);
  c.strokeStyle = 'rgba(190,140,0,0.55)';
  c.stroke();

  const bw = R * 1.12, bh = R * 0.80;
  const bx = x - bw / 2, by = cy + R * 0.82;
  c.beginPath();
  rr(c, bx, by, bw, bh, Math.min(bh * 0.35, 2.5));
  c.fillStyle = '#9aa7b8';
  c.fill();
  c.beginPath();
  c.moveTo(bx + bw * 0.14, by + bh * 0.55);
  c.lineTo(bx + bw * 0.86, by + bh * 0.55);
  c.lineWidth = Math.max(1, s * 0.05);
  c.strokeStyle = 'rgba(90,102,118,0.85)';
  c.stroke();

  c.restore();
}

function drawTubeIcon(c, x, y, size) {
  if (!(size > 0)) return;
  const s = size;
  const tw = s * 0.42;
  const th = s * 0.84;
  const tcx = x - s * 0.26;
  const tx = tcx - tw / 2, ty = y - th / 2;
  const trad = Math.min(tw * 0.46, th * 0.22);

  c.save();
  c.shadowBlur = 0; c.shadowColor = 'transparent';

  c.beginPath();
  rr(c, tx, ty, tw, th, trad);
  c.fillStyle = 'rgba(160,220,255,0.16)';
  c.fill();

  c.save();
  c.beginPath();
  rr(c, tx, ty, tw, th, trad);
  c.clip();
  c.fillStyle = 'rgba(90,195,255,0.80)';
  c.fillRect(tx, ty + th * 0.50, tw, th * 0.50);
  c.fillStyle = 'rgba(255,255,255,0.20)';
  c.fillRect(tx + tw * 0.16, ty + th * 0.10, tw * 0.16, th * 0.80);
  c.restore();

  c.beginPath();
  rr(c, tx, ty, tw, th, trad);
  c.lineWidth = Math.max(1.1, s * 0.065);
  c.strokeStyle = '#a9dcff';
  c.stroke();

  const px = x + s * 0.26, py = y;
  const arm = s * 0.27, thick = s * 0.155;
  c.fillStyle = '#3ddc84';
  c.beginPath();
  rr(c, px - arm, py - thick / 2, arm * 2, thick, thick / 2);
  c.fill();
  c.beginPath();
  rr(c, px - thick / 2, py - arm, thick, arm * 2, thick / 2);
  c.fill();

  c.restore();
}

function drawMusicIcon(c, x, y, size, isEnabled) {
  if (!(size > 0)) return;
  const s = size;

  c.save();
  c.shadowBlur = 0; c.shadowColor = 'transparent';
  c.lineJoin = 'round';
  c.lineCap = 'round';

  const bodyCol = isEnabled ? '#dceaff' : 'rgba(220,234,255,0.42)';

  c.beginPath();
  c.moveTo(x - s * 0.46, y - s * 0.15);
  c.lineTo(x - s * 0.24, y - s * 0.15);
  c.lineTo(x - s * 0.02, y - s * 0.40);
  c.lineTo(x - s * 0.02, y + s * 0.40);
  c.lineTo(x - s * 0.24, y + s * 0.15);
  c.lineTo(x - s * 0.46, y + s * 0.15);
  c.closePath();
  c.fillStyle = bodyCol;
  c.fill();

  if (isEnabled) {
    const cx = x - s * 0.02;
    c.strokeStyle = '#dceaff';
    c.lineWidth = Math.max(1.1, s * 0.075);
    const radii = [s * 0.18, s * 0.31, s * 0.44];
    for (let i = 0; i < radii.length; i++) {
      c.beginPath();
      c.arc(cx, y, radii[i], -Math.PI * 0.28, Math.PI * 0.28);
      c.stroke();
    }
  } else {
    c.beginPath();
    c.moveTo(x - s * 0.44, y + s * 0.38);
    c.lineTo(x + s * 0.42, y - s * 0.38);
    c.lineWidth = Math.max(2, s * 0.13);
    c.strokeStyle = '#ff453a';
    c.stroke();
  }

  c.restore();
}

/* ---------- 5. LEVEL GEN ---------- */
/* A new color every 3 levels (slower difficulty curve) */
function colorsForLevel(lv) { return Math.min(4 + Math.floor((lv-1)/3), COLORS.length); }

function shuffle(a) {
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* True if every non-empty tube is full and a single color */
function isSolvedState(ts) {
  for (const t of ts) {
    if (!t.length) continue;
    if (t.length !== CAP) return false;
    for (let i = 1; i < CAP; i++) if (t[i] !== t[0]) return false;
  }
  return true;
}

/* Checks whether moving the top color of `src` onto `dst` is a valid REVERSE
   move, i.e. the exact inverse of a legal forward pour (dst -> src).
   Returns the number of units (k) to move, or 0 if invalid. Truthy = valid. */
function isValidPourBackwards(tubes, src, dst) {
  if (src === dst) return 0;
  const s = tubes[src], d = tubes[dst];
  if (!s || !d || !s.length || d.length >= CAP) return 0;

  const c = s[s.length - 1];
  const run = topRunLength(s);
  const ks = [];
  for (let k = 1; k <= Math.min(run, CAP - d.length); k++) ks.push(k);
  shuffle(ks);

  for (const k of ks) {
    const srcLeft = s.length - k;
    /* forward pour (dst -> src) is only legal if src is empty or its top is c */
    if (srcLeft > 0 && s[srcLeft - 1] !== c) continue;
    /* moving a whole tube into an empty one is pointless */
    if (srcLeft === 0 && d.length === 0) continue;

    /* the forward pour must move exactly k units to be a true inverse */
    const dTopRun = (d.length && d[d.length - 1] === c) ? topRunLength(d) : 0;
    if (Math.min(k + dTopRun, CAP - srcLeft) !== k) continue;

    /* forward source can't be an already-complete tube (canPour rule) */
    if (dTopRun === d.length && d.length + k === CAP) continue;

    return k;
  }
  return 0;
}

function generateTubes(lv) {
  const nColors = colorsForLevel(lv);
  const emptyTubes = lv < 15 ? 2 : 1;
  let last = null;

  for (let attempt = 0; attempt < 30; attempt++) {
    /* a) fully sorted tubes + empty tubes */
    const ts = [];
    for (let i = 0; i < nColors; i++) ts.push(new Array(CAP).fill(COLORS[i].key));
    for (let e = 0; e < emptyTubes; e++) ts.push([]);

    /* c) 100-150 random valid reverse pours */
    const target = 100 + Math.floor(Math.random() * 51);
    let done = 0, fails = 0;
    while (done < target && fails < 500) {
      const src = Math.floor(Math.random() * ts.length);
      const dst = Math.floor(Math.random() * ts.length);
      const k = isValidPourBackwards(ts, src, dst);
      if (!k) { fails++; continue; }
      const color = ts[src][ts[src].length - 1];
      for (let i = 0; i < k; i++) ts[src].pop();
      for (let i = 0; i < k; i++) ts[dst].push(color);
      done++;
    }

    last = ts;
    /* d) never hand out an already-solved board */
    if (!isSolvedState(ts)) return ts;
  }
  return last;
}

/* ---------- 6. LAYOUT ---------- */
function computeLayout() {
  const W = view.w, H = view.h;
  if (W === 0 || H === 0) return;

  const HUD_H = 72, PAD_X = 16, BOT_PAD = 88;
  const areaTop = HUD_H + 6;
  const areaH = H - areaTop - BOT_PAD;
  const areaW = W - PAD_X*2;

  const n = tubes.length;
  const rows = n <= 5 ? 1 : 2;
  const perRow = Math.ceil(n / rows);
  const gapX = Math.max(9, Math.min(20, areaW*0.025));

  const maxTubeW = (areaW - (perRow-1)*gapX) / perRow;
  const rowH = areaH / rows;
  const maxTubeH = rowH * 0.84;

  let tw = Math.min(maxTubeW, maxTubeH/3.6, 92);
  tw = Math.max(tw, 22);
  const th = tw * 3.6;

  layout.tubes = [];
  for (let r = 0; r < rows; r++) {
    const start = r*perRow;
    const end = Math.min(start + perRow, n);
    const count = end - start;
    if (count <= 0) continue;
    const totalW = count*tw + (count-1)*gapX;
    const startX = (W - totalW)/2;
    const centerY = areaTop + rowH*(r + 0.5);
    const y = centerY - th/2;
    for (let i = 0; i < count; i++) {
      layout.tubes.push({ x: startX + i*(tw+gapX), y, w: tw, h: th });
    }
  }

  /* HUD buttons (top right): [UNDO] [RESET] [SFX] [music] */
  const btnH = 34, btnW = 48, btnGap = 4, hudPad = 8, musicW = 34, sfxW = 38;
  const btnY = (HUD_H - btnH)/2 + 4;
  layout.musicBtn = { x: W - hudPad - musicW,                 y: btnY, w: musicW, h: btnH };
  layout.sfxBtn   = { x: layout.musicBtn.x - btnGap - sfxW,   y: btnY, w: sfxW,   h: btnH, label:'SFX',   fs:11 };
  layout.resetBtn = { x: layout.sfxBtn.x - btnGap - btnW,     y: btnY, w: btnW,   h: btnH, label:'RESET', fs:12 };
  layout.undoBtn  = { x: layout.resetBtn.x - btnGap - btnW,   y: btnY, w: btnW,   h: btnH, label:'UNDO',  fs:12 };

  /* Bottom action bar: [coins] [HINT] [TUBE] — centered */
  const barH = 46, barGap = 8, barPad = 16, coinW = 78;
  const barY = H - 20 - barH;
  let bw = (W - barPad*2 - coinW - barGap*2) / 2;
  bw = Math.max(62, Math.min(170, bw));
  const totalW = coinW + bw*2 + barGap*2;
  const startX = (W - totalW) / 2;

  layout.coinBar  = { x: startX, y: barY, w: coinW, h: barH };
  layout.hintBtn  = { x: startX + coinW + barGap,                     y: barY, w: bw, h: barH };
  layout.extraBtn = { x: startX + coinW + barGap + bw + barGap,       y: barY, w: bw, h: barH };
}

/* ---------- 7. GAME LOGIC ---------- */
function startLevel(lv) {
  level = lv;
  tubes = generateTubes(lv);
  initialTubes = cloneTubes(tubes);   // deep copy -> RESET works
  history = [];                       // fresh UNDO stack
  selected = -1; anim = null; won = false; winProgress = 0; moves = 0;
  shakeT = 0; shakeIndex = -1;
  particles = [];
  hint = null;
  toast = null;
  coinRewardT = 0;
  rewardGranted = false;
  if (view.w > 0) computeLayout();
}

function topRunLength(tube) {
  if (!tube.length) return 0;
  const c = tube[tube.length-1];
  let n = 1;
  for (let i = tube.length-2; i >= 0; i--) { if (tube[i] === c) n++; else break; }
  return n;
}
function isTubeComplete(t) {
  if (t.length !== CAP) return false;
  for (let i = 1; i < CAP; i++) if (t[i] !== t[0]) return false;
  return true;
}
function canPour(src, dst) {
  if (src === dst) return false;
  const s = tubes[src], d = tubes[dst];
  if (!s || !d) return false;
  if (!s.length) return false;
  if (d.length >= CAP) return false;
  if (isTubeComplete(s)) return false;
  if (!d.length) return true;
  return d[d.length-1] === s[s.length-1];
}
function doPour(src, dst) {
  const s = tubes[src], d = tubes[dst];
  const color = s[s.length-1];
  const amount = Math.min(topRunLength(s), CAP - d.length);
  if (amount <= 0) return;

  history.push({ tubes: cloneTubes(tubes), moves });
  if (history.length > 120) history.shift();

  for (let i = 0; i < amount; i++) s.pop();
  for (let i = 0; i < amount; i++) d.push(color);
  moves++;

  anim = { from:src, to:dst, color, amount, elapsed:0, dur:380, p:0 };
  playPour();
  vibrate(20);

  spawnBubbles(dst, color);

  hint = null;
}
function isWin() {
  for (const t of tubes) {
    if (!t.length) continue;
    if (t.length !== CAP) return false;
    for (let i = 1; i < t.length; i++) if (t[i] !== t[0]) return false;
  }
  return true;
}
function checkWin() {
  if (won) return;
  if (isWin()) {
    won = true; winProgress = 0; coinRewardT = 0;
    rewardGranted = false;
    saveProgress();
    playWin();
    spawnConfetti();
    vibrate([100, 50, 100, 50, 300]);

    /* Coins only once per level (anti-farming) */
    const key = 'watersort_completed_' + level;
    let alreadyDone = false;
    try { alreadyDone = localStorage.getItem(key) !== null; } catch (e) {}

    if (!alreadyDone) {
      try { localStorage.setItem(key, 'true'); } catch (e) {}
      coins += WIN_COINS;
      saveCoins();
      rewardGranted = true;
      setTimeout(playCoin, 520);      // coin sound after the win jingle
    }
  }
}
function doUndo() {
  if (won || anim) return;
  if (!history.length) { buzz(); return; }
  const snap = history.pop();
  tubes = snap.tubes; moves = snap.moves; selected = -1; anim = null;
  hint = null;
  if (layout.tubes.length !== tubes.length) computeLayout();
  playSelect();
}
function doReset() {
  if (anim) return;
  tubes = cloneTubes(initialTubes);
  history = []; selected = -1; won = false; winProgress = 0; moves = 0; shakeT = 0;
  particles = [];
  hint = null; coinRewardT = 0;
  if (layout.tubes.length !== tubes.length) computeLayout();
  playSelect();
}
function nextLevel() {
  startLevel(Math.min(level + 1, TOTAL_LEVELS));
}

/* ---------- 7a. HINT + EXTRA TUBE ---------- */
function findHint() {
  let best = null;
  for (let i = 0; i < tubes.length; i++) {
    const run = topRunLength(tubes[i]);
    if (run === 0) continue;
    const wouldEmpty = (run === tubes[i].length);
    for (let j = 0; j < tubes.length; j++) {
      if (!canPour(i, j)) continue;
      const dstLen = tubes[j].length;
      if (dstLen === 0 && wouldEmpty) continue;

      let score = 0;
      if (dstLen > 0) score += 10;
      if (dstLen + run === CAP) score += 6;
      if (wouldEmpty) score += 3;
      if (tubes[i].length === CAP) score += 1;

      if (!best || score > best.score) best = { src:i, dst:j, score };
    }
  }
  return best;
}

function useHint() {
  if (won || anim) return;
  if (hint) { showToast('Hint already showing!'); return; }
  if (coins < HINT_COST) {
    buzz();
    showToast('Not enough coins! Need ' + HINT_COST);
    return;
  }
  const h = findHint();
  if (!h) {
    buzz();
    showToast('No moves left! Try adding a tube or resetting.', 2800);
    return;
  }
  coins -= HINT_COST;
  saveCoins();
  hint = { src: h.src, dst: h.dst, t: 2000 };
  playSelect();
  vibrate(15);
  showToast('Pour from tube ' + (h.src + 1) + ' to tube ' + (h.dst + 1), 2400);
}

function buyExtraTube() {
  if (won || anim) return;
  if (tubes.length >= MAX_TUBES) {
    buzz();
    showToast('Maximum ' + MAX_TUBES + ' tubes reached!');
    return;
  }
  if (coins < TUBE_COST) {
    buzz();
    showToast('Not enough coins! Need ' + TUBE_COST);
    return;
  }
  coins -= TUBE_COST;
  saveCoins();

  tubes.push([]);
  initialTubes.push([]);
  history = [];
  hint = null;
  computeLayout();
  playSelect();
  vibrate(25);
  showToast('Extra tube added!');
}

/* ---------- 7b. PARTICLES (confetti + bubbles) ---------- */
const CONFETTI_COLORS = COLORS.map(c => c.hex).concat(['#ffffff', '#ffd700', '#ff69b4']);

function spawnConfetti() {
  const W = view.w, H = view.h;
  const count = 100 + Math.floor(Math.random() * 51);
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * W,
      y: -10 - Math.random() * H * 0.45,
      vx: (Math.random() - 0.5) * 140,
      vy: 60 + Math.random() * 180,
      size: 6 + Math.random() * 7,
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
      shape: Math.random() < 0.55 ? 'square' : 'circle',
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 9,
      tilt: Math.random() * Math.PI * 2,
      vt: 3 + Math.random() * 5,
      sway: Math.random() * Math.PI * 2,
      swayV: 1.5 + Math.random() * 2.5
    });
  }
}

function spawnBubbles(tubeIdx, colorKey) {
  const r = layout.tubes[tubeIdx];
  if (!r) return;
  const n = 5 + Math.floor(Math.random() * 6);
  const cx = r.x + r.w/2;
  for (let i = 0; i < n; i++) {
    particles.push({
      bubble: true,
      x: cx + (Math.random() - 0.5) * r.w * 0.72,
      y: r.y + r.h * 0.14 + Math.random() * r.h * 0.18,
      vx: (Math.random() - 0.5) * 46,
      vy: -(34 + Math.random() * 62),
      size: 2.2 + Math.random() * 3.6,
      color: HEX[colorKey] || '#8fe6ff',
      life: 0,
      maxLife: 0.55 + Math.random() * 0.55,
      wob: Math.random() * Math.PI * 2,
      wobV: 4 + Math.random() * 5
    });
  }
}

function updateParticles(dt) {
  if (!particles.length) return;
  const s = dt / 1000, H = view.h;
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    if (p.bubble) {
      p.life += s;
      p.wob += p.wobV * s;
      p.x += (p.vx + Math.sin(p.wob) * 26) * s;
      p.y += p.vy * s;
      p.vy *= Math.max(0, 1 - 1.6 * s);
      if (p.life >= p.maxLife || p.y < -20) particles.splice(i, 1);
      continue;
    }

    p.vy += 330 * s;
    if (p.vy > 420) p.vy = 420;
    p.sway += p.swayV * s;
    p.x += (p.vx + Math.sin(p.sway) * 40) * s;
    p.y += p.vy * s;
    p.rot += p.vr * s;
    p.tilt += p.vt * s;
    if (p.y > H + 20) particles.splice(i, 1);
  }
}

function drawParticles() {
  if (!particles.length) return;
  ctx.save();
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];

    if (p.bubble) {
      const fade = 1 - Math.max(0, (p.life - p.maxLife*0.55) / (p.maxLife*0.45));
      const a = Math.max(0, Math.min(1, fade));
      if (a <= 0.01) continue;
      ctx.save();
      ctx.globalAlpha = a * 0.92;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.fill();
      ctx.lineWidth = 1.4;
      ctx.strokeStyle = p.color;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(p.x - p.size*0.30, p.y - p.size*0.30, p.size*0.32, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.fill();
      ctx.restore();
      continue;
    }

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    if (p.shape === 'circle') {
      ctx.beginPath(); ctx.arc(0, 0, p.size * 0.45, 0, Math.PI * 2); ctx.fill();
    } else {
      const flip = Math.max(0.2, Math.abs(Math.cos(p.tilt)));
      ctx.fillRect(-p.size/2, -p.size*flip/2, p.size, p.size*flip);
    }
    ctx.restore();
  }
  ctx.restore();
}

/* ---------- 8. INPUT ---------- */
function getPointerPos(e) {
  const rect = canvas.getBoundingClientRect();
  const p = (e.touches && e.touches[0]) ? e.touches[0]
          : (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0]
          : e;
  return { x: p.clientX - rect.left, y: p.clientY - rect.top };
}
function tubeAtPoint(p) {
  for (let i = 0; i < layout.tubes.length; i++) {
    const r = layout.tubes[i];
    if (p.x >= r.x-7 && p.x <= r.x+r.w+7 && p.y >= r.y-14 && p.y <= r.y+r.h+10) return i;
  }
  return -1;
}
function toggleMusic() {
  musicEnabled = !musicEnabled;
  try { localStorage.setItem('watersort_music', String(musicEnabled)); } catch (e) {}
  if (musicEnabled) { initAudio(); startBGM(); playSelect(); }
  else stopBGM();
}
function toggleSfx() {
  sfxEnabled = !sfxEnabled;
  try { localStorage.setItem('watersort_sfx', String(sfxEnabled)); } catch (e) {}
  initAudio();
  if (sfxEnabled) playSelect();      // test sound (silent when turned off)
}
function handleTap(p) {
  initAudio();
  if (musicEnabled) startBGM();

  /* ---- MAIN MENU ---- */
  if (gameState === 'MENU') {
    if (showHelp) { playSelect(); showHelp = false; return; }
    if (pointInRect(p, ui.musicBtn)) { toggleMusic(); return; }
    if (pointInRect(p, ui.playBtn)) {
      playSelect();
      gameState = 'PLAYING';
      startLevel(getUnlocked());
    } else if (pointInRect(p, ui.levelsBtn)) {
      playSelect();
      gameState = 'LEVELS';
      mapAutoScroll = true;
    } else if (pointInRect(p, ui.helpBtn)) {
      playSelect();
      showHelp = true;
    } else if (pointInRect(p, ui.shopBtn)) {
      playSelect();
      gameState = 'SHOP';
    }
    return;
  }

  /* ---- SHOP ---- */
  if (gameState === 'SHOP') {
    if (pointInRect(p, shopUI.backBtn)) { playSelect(); gameState = 'MENU'; return; }
    if (pointInRect(p, shopUI.tabs.bgs)) {
      if (shopTab !== 'bgs') { playSelect(); shopTab = 'bgs'; }
      return;
    }
    if (pointInRect(p, shopUI.tabs.tubes)) {
      if (shopTab !== 'tubes') { playSelect(); shopTab = 'tubes'; }
      return;
    }
    for (let i = 0; i < shopUI.cards.length; i++) {
      const card = shopUI.cards[i];
      if (!pointInRect(p, card)) continue;
      const item = card.item;

      if (card.equipped) { playSelect(); return; }

      if (card.owned) {
        if (shopTab === 'bgs') { activeBg = item.id; applyActiveBg(); }
        else                   { activeTube = item.id; }
        saveShopProgress();
        playSelect(); vibrate(15);
        showToast(item.name + ' equipped!');
        return;
      }

      if (coins < item.cost) {
        buzz();
        showToast('Not enough coins! Need ' + item.cost);
        return;
      }
      coins -= item.cost;
      saveCoins();

      if (shopTab === 'bgs') {
        ownedBgs.push(item.id);
        activeBg = item.id;
        applyActiveBg();
      } else {
        ownedTubes.push(item.id);
        activeTube = item.id;
      }
      saveShopProgress();
      playCoin(); vibrate(25);
      showToast(item.name + ' purchased!');
      return;
    }
    return;
  }

  /* ---- LEVEL MAP ---- */
  if (gameState === 'LEVELS') {
    if (pointInRect(p, ui.backBtn)) { playSelect(); gameState = 'MENU'; return; }
    if (p.y < 76) return;
    for (let i = 0; i < ui.cells.length; i++) {
      if (pointInRect(p, ui.cells[i])) {
        playSelect();
        gameState = 'PLAYING';
        startLevel(ui.cells[i].lv);
        return;
      }
    }
    return;
  }

  /* ---- PLAYING ---- */
  if (pointInRect(p, layout.musicBtn)) { toggleMusic(); return; }
  if (pointInRect(p, layout.sfxBtn))   { toggleSfx();   return; }
  if (won) {
    if (pointInRect(p, layout.nextBtn))   { nextLevel(); return; }
    if (pointInRect(p, layout.replayBtn)) { playSelect(); startLevel(level); return; }
    if (pointInRect(p, ui.menuBtn))       { particles = []; toast = null; gameState = 'MENU'; return; }
    return;
  }
  if (pointInRect(p, ui.backBtn)) {
    anim = null; selected = -1; hint = null; toast = null;
    gameState = 'MENU';
    return;
  }
  if (anim) return;
  if (pointInRect(p, layout.undoBtn))  { doUndo();  return; }
  if (pointInRect(p, layout.resetBtn)) { doReset(); return; }
  if (pointInRect(p, layout.hintBtn))  { useHint();      return; }
  if (pointInRect(p, layout.extraBtn)) { buyExtraTube(); return; }

  const idx = tubeAtPoint(p);
  if (idx < 0) { selected = -1; return; }

  if (selected === -1) {
    if (!tubes[idx].length) return;
    selected = idx; playSelect(); vibrate(10); return;
  }
  if (selected === idx) { selected = -1; return; }

  if (canPour(selected, idx)) {
    doPour(selected, idx); selected = -1;
  } else {
    buzz();
    shakeT = SHAKE_DUR; shakeIndex = idx;
    selected = tubes[idx].length > 0 ? idx : -1;
  }
}

/* Pointer events */
let ptr = null;

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  const p = getPointerPos(e);
  if (gameState === 'LEVELS') {
    ptr = { startY:p.y, lastY:p.y, moved:false };
  } else {
    handleTap(p);

});
canvas.addEventListener('pointermove', e => {

  if (!ptr.moved && Math.abs(p.y - ptr.startY) > 8) ptr.moved = true;
  if (ptr.moved) {
    mapScroll = Math.max(0, Math.min(mapScroll - (p.y - ptr.lastY), mapMaxScroll));
  }
  ptr.lastY = p.y;
});
canvas.addEventListener('pointerup', e => {

});
canvas.addEventListener('pointercancel', () => { ptr = null; });
canvas.addEventListener('wheel', e => {

/* ---------- 9. AUDIO ---------- */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) { try { audioCtx = new AC(); } catch(_) {} }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, dur, type='sine', vol=0.05, slideTo=null) {
  if (!sfxEnabled) return;
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, now);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), now+dur);
  g.gain.setValueAtTime(vol, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now+dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(now); osc.stop(now+dur+0.02);
}
const playSelect = () => tone(760, 0.07, 'sine', 0.035);
const playPour   = () => tone(620, 0.18, 'sine', 0.045, 250);
const buzz       = () => { tone(150, 0.15, 'square', 0.045, 110); vibrate([50, 50, 50]); };
function playWin() {
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
    setTimeout(() => tone(f, 0.24, 'sine', 0.06), i*110));
}
function playCoin() {
  tone(988, 0.09, 'triangle', 0.05);
  setTimeout(() => tone(1319, 0.14, 'triangle', 0.045), 80);
}

/* ----- Background music ----- */
const BGM_STEP  = 0.26;
const BGM_BASS  = [55, 43.65, 65.41, 49];
const BGM_ARP   = [
  [220.00, 261.63, 329.63, 261.63],
  [174.61, 220.00, 261.63, 220.00],
  [261.63, 329.63, 392.00, 329.63],
  [196.00, 246.94, 293.66, 246.94]
];
const BGM_MELODY = [659.25,0,523.25,0, 523.25,0,440,0, 523.25,0,659.25,0, 587.33,0,493.88,0];
let bgmGain = null, bgmTimer = null, bgmStep = 0, bgmNext = 0;

function bgmNote(freq, t, dur, type, vol) {
  if (!audioCtx || !bgmGain) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(bgmGain);
  o.start(t); o.stop(t + dur + 0.05);
}
function bgmSchedule(step, t) {
  const chord = Math.floor(step / 4), inChord = step % 4;
  if (inChord === 0 || inChord === 2) bgmNote(BGM_BASS[chord], t, BGM_STEP*2*0.95, 'triangle', 0.14);
  bgmNote(BGM_ARP[chord][inChord], t, BGM_STEP*1.2, 'sine', 0.03);
  if (BGM_MELODY[step]) bgmNote(BGM_MELODY[step], t, BGM_STEP*2.2, 'sine', 0.05);
}
function bgmTick() {
  if (!audioCtx || !bgmGain) return;
  const now = audioCtx.currentTime;
  if (bgmNext < now) bgmNext = now + 0.05;
  while (bgmNext < now + 0.3) {
    bgmSchedule(bgmStep, bgmNext);
    bgmNext += BGM_STEP;
    bgmStep = (bgmStep + 1) % 16;
  }
}
function startBGM() {
  if (!musicEnabled) return;
  initAudio();
  if (!audioCtx || bgmTimer) return;
  bgmGain = audioCtx.createGain();
  const now = audioCtx.currentTime;
  bgmGain.gain.setValueAtTime(0.0001, now);
  bgmGain.gain.linearRampToValueAtTime(0.6, now + 0.8);
  bgmGain.connect(audioCtx.destination);
  bgmStep = 0;
  bgmNext = now + 0.1;
  bgmTimer = setInterval(bgmTick, 90);
  bgmTick();
}
function stopBGM() {
  if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
  if (bgmGain && audioCtx) {
    const g = bgmGain, now = audioCtx.currentTime;
    try {
      g.gain.cancelScheduledValues(now);
      g.gain.setValueAtTime(Math.max(0.0001, g.gain.value), now);
      g.gain.linearRampToValueAtTime(0.0001, now + 0.25);
    } catch (e) {}
    setTimeout(() => { try { g.disconnect(); } catch (e) {} }, 450);
  }
  bgmGain = null;
}
document.addEventListener('visibilitychange', () => {
  if (!audioCtx) return;
  try {
    if (document.hidden) audioCtx.suspend();
    else audioCtx.resume();
  } catch (e) {}
});

/* ---------- 10. RENDER ---------- */
function getDisplay(i) {
  const t = tubes[i];
  if (!anim) return { colors: t, frac: 0, fracColor: null };

  if (i === anim.from) {
    const remaining = anim.amount * (1 - anim.p);
    const full = Math.floor(remaining);
    const frac = remaining - full;
    return {
      colors: t.concat(new Array(full).fill(anim.color)),
      frac, fracColor: anim.color
    };
  }
  if (i === anim.to) {
    const shown = anim.amount * anim.p;
    const full  = Math.floor(shown);
    const base  = t.slice(0, t.length - anim.amount);
    return {
      colors: base.concat(new Array(full).fill(anim.color)),
      frac: shown - full, fracColor: anim.color
    };
  }
  return { colors: t, frac: 0, fracColor: null };
}

function drawCoinPill(x, y, w, h) {
  ctx.save();
  ctx.beginPath(); rr(ctx, x, y, w, h, 14);
  ctx.fillStyle = 'rgba(255,214,10,0.10)';
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = 'rgba(255,214,10,0.42)';
  ctx.stroke();

  const r = Math.min(h*0.215, 11);
  const iconCX = x + 9 + r;
  drawCoinIcon(ctx, iconCX, y + h/2, r);

  const numSize = Math.round(h*0.36);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = '800 ' + numSize + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const tw = ctx.measureText(String(coins)).width;
  ctx.fillStyle = '#ffe066';
  ctx.fillText(String(coins), Math.max(iconCX + r + 5, x + w - 10 - tw), y + h/2 + 1);
  ctx.restore();
}

function drawBarButton(b, iconType, label, sub, enabled, affordable) {
  if (!b) return;
  ctx.save();
  ctx.beginPath(); rr(ctx, b.x, b.y, b.w, b.h, 14);
  ctx.fillStyle = enabled ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0.04)';
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = enabled ? 'rgba(160,210,255,0.45)' : 'rgba(255,255,255,0.12)';
  ctx.stroke();

  const cx = b.x + b.w / 2;
  const fs = Math.max(10, Math.min(13.5, b.w * 0.115));

  const font1 = '800 ' + fs.toFixed(1) + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.font = font1;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const labelW = ctx.measureText(label).width;
  const icoS  = fs * 1.45;
  const gap1  = fs * 0.32;
  const line1W = icoS + gap1 + labelW;
  const l1x = cx - line1W / 2;
  const l1y = b.y + b.h/2 - 7.5;

  if (iconType === 'hint')      drawHintIcon(ctx, l1x + icoS/2, l1y, icoS);
  else if (iconType === 'tube') drawTubeIcon(ctx, l1x + icoS/2, l1y, icoS);

  ctx.font = font1;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = enabled ? '#dceaff' : 'rgba(220,234,255,0.30)';
  ctx.fillText(label, l1x + icoS + gap1, l1y);

  const fs2 = fs * 0.82;
  const font2 = '700 ' + fs2.toFixed(1) + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.font = font2;
  const subW  = ctx.measureText(sub).width;
  const coinR = fs2 * 0.62;
  const gap2  = fs2 * 0.36;
  const line2W = coinR*2 + gap2 + subW;
  const l2x = cx - line2W / 2;
  const l2y = b.y + b.h/2 + 9.5;

  drawCoinIcon(ctx, l2x + coinR, l2y, coinR);

  ctx.font = font2;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = affordable ? 'rgba(255,224,102,0.92)' : 'rgba(255,224,102,0.34)';
  ctx.fillText(sub, l2x + coinR*2 + gap2, l2y);

  ctx.restore();
}

function drawTube(i) {
  const r = layout.tubes[i]; if (!r) return;
  const disp = getDisplay(i);
  const isSel = (selected === i) && !anim;
  const skin = SHOP_TUBES.find(t => t.id === activeTube) || SHOP_TUBES[0];

  let ox = 0, oy = 0;
  if (shakeT > 0 && shakeIndex === i) ox = Math.sin(shakeT*0.09)*9*(shakeT/SHAKE_DUR);
  if (isSel) oy = -10;
  if (anim && anim.from === i) oy = -Math.sin(anim.p*Math.PI)*r.h*0.10;

  const x = r.x + ox, y = r.y + oy, w = r.w, h = r.h;
  const radius = Math.min(w*0.34, 20);
  const wall = Math.max(3, w*0.075);

  ctx.beginPath(); rr(ctx, x, y, w, h, radius);
  ctx.fillStyle = skin.fill; ctx.fill();

  ctx.save();
  ctx.beginPath();
  rr(ctx, x+wall, y+wall, w-2*wall, h-2*wall, Math.max(1, radius-wall));
  ctx.clip();

  const innerX = x + wall, innerW = w - 2*wall;
  const innerBottom = y + h - wall;
  const topGap = w * 0.09;
  const unitH = (h - 2*wall - topGap) / CAP;

  let cy = innerBottom;
  for (let k = 0; k < disp.colors.length; k++) {
    cy -= unitH;
    ctx.fillStyle = HEX[disp.colors[k]] || '#888888';
    ctx.fillRect(innerX, cy, innerW, unitH + 0.6);
  }
  if (disp.frac > 0.002 && disp.fracColor) {
    const fh = unitH * Math.min(1, disp.frac);
    ctx.fillStyle = HEX[disp.fracColor] || '#888888';
    ctx.fillRect(innerX, cy - fh, innerW, fh + 0.6);
  }
  ctx.restore();

  ctx.beginPath(); rr(ctx, x, y, w, h, radius);
  if (isSel) {
    ctx.shadowColor = 'rgba(120,220,255,0.95)';
    ctx.shadowBlur = 18;
    ctx.lineWidth = 3; ctx.strokeStyle = '#8fe6ff';
  } else {
    ctx.lineWidth = 2; ctx.strokeStyle = skin.border;
  }
  ctx.stroke();
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';

  if (hint && (hint.src === i || hint.dst === i)) {
    const isSrc = (hint.src === i);
    const pulse = 0.55 + 0.45 * Math.sin(performance.now() * 0.012);
    ctx.save();
    ctx.beginPath(); rr(ctx, x - 4, y - 4, w + 8, h + 8, radius + 4);
    ctx.lineWidth = 3;
    ctx.strokeStyle = isSrc
      ? 'rgba(255,214,10,' + pulse.toFixed(3) + ')'
      : 'rgba(110,255,190,' + pulse.toFixed(3) + ')';
    ctx.shadowColor = isSrc ? 'rgba(255,214,10,0.9)' : 'rgba(110,255,190,0.9)';
    ctx.shadowBlur = 18;
    ctx.stroke();
    ctx.restore();
  }
}

function drawStream() {
  if (!anim) return;
  const from = layout.tubes[anim.from], to = layout.tubes[anim.to];
  if (!from || !to) return;
  const liftFrom = -Math.sin(anim.p*Math.PI)*from.h*0.10;
  const sx = from.x + from.w/2, sy = from.y + liftFrom + from.h*0.09;
  const tx = to.x + to.w/2, ty = to.y + to.h*0.10;
  const cx = (sx+tx)/2, cy = Math.min(sy, ty) - Math.max(50, from.h*0.35);
  ctx.save();
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(cx, cy, tx, ty);
  ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(6, from.w*0.45);
  ctx.strokeStyle = HEX[anim.color] || '#ffffff';
  ctx.globalAlpha = 0.92;
  ctx.stroke(); ctx.restore();
}

      ctx.fillText(wrapped[i][j], W/2, ty);

  ctx.restore();

function drawLock(cx, cy, s) {
  ctx.save();
  ctx.strokeStyle = ctx.fillStyle = 'rgba(200,215,235,0.35)';
  ctx.lineWidth = Math.max(2, s*0.12);
  ctx.beginPath(); ctx.arc(cx, cy - s*0.12, s*0.2, Math.PI, 0); ctx.stroke();
  ctx.beginPath(); rr(ctx, cx - s*0.3, cy - s*0.08, s*0.6, s*0.42, s*0.08); ctx.fill();
  ctx.restore();
}

function drawLevelMap() {
  const W = view.w, H = view.h;
  ctx.fillStyle = bgGradient || '#0b1220';
  ctx.fillRect(0, 0, W, H);

  const unlocked = getUnlocked();
  const cols = W >= 480 ? 5 : 4;
  const padX = 20, gap = 12, headerH = 76;
  const cell = Math.min(84, (W - padX*2 - (cols-1)*gap) / cols);
  const gridW = cols*cell + (cols-1)*gap;
  const startX = (W - gridW) / 2;
  const rows = Math.ceil(TOTAL_LEVELS / cols);
  const rowStep = cell + gap;
  const contentH = rows*rowStep + 20;
  const viewH = H - headerH;

  mapMaxScroll = Math.max(0, contentH - viewH);
  if (mapAutoScroll) {
    const row = Math.floor((Math.min(unlocked, TOTAL_LEVELS) - 1) / cols);
    mapScroll = row*rowStep - viewH/2 + cell/2;
    mapAutoScroll = false;
  }
  mapScroll = Math.max(0, Math.min(mapScroll, mapMaxScroll));

  const firstRow = Math.max(0, Math.floor((mapScroll - 10 - cell) / rowStep));
  const lastRow  = Math.min(rows - 1, Math.ceil((mapScroll + viewH) / rowStep));

  ui.cells = [];
  ctx.save();
  ctx.beginPath(); ctx.rect(0, headerH, W, viewH); ctx.clip();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  for (let r = firstRow; r <= lastRow; r++) {
    const y = headerH + 10 + r*rowStep - mapScroll;
    if (y + cell < headerH || y > H) continue;

    for (let c = 0; c < cols; c++) {
      const i = r*cols + c + 1;
      if (i > TOTAL_LEVELS) break;
      const x = startX + c*(cell+gap);

      const open = i <= unlocked;
      const current = i === unlocked;

      ctx.beginPath(); rr(ctx, x, y, cell, cell, 16);
      if (current)   ctx.fillStyle = '#3ddc84';
      else if (open) ctx.fillStyle = 'rgba(74,168,255,0.22)';
      else           ctx.fillStyle = 'rgba(255,255,255,0.05)';
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = current ? '#8fffc0' : open ? 'rgba(143,230,255,0.55)' : 'rgba(255,255,255,0.12)';
      ctx.stroke();

      if (open) {
        ctx.fillStyle = current ? '#04220f' : '#eaf2ff';
        ctx.font = '800 ' + Math.round(cell*0.34) + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(i), x + cell/2, y + cell/2 + 1);
        ui.cells.push({ x, y, w:cell, h:cell, lv:i });
      } else {
        drawLock(x + cell/2, y + cell/2, cell*0.5);
      }
    }
  }
  ctx.restore();

  ctx.fillStyle = '#0e1626';
  ctx.fillRect(0, 0, W, headerH);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#eaf2ff';
  ctx.font = '800 20px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('SELECT LEVEL', W/2, headerH/2 - 9);

  ctx.fillStyle = 'rgba(180,200,225,0.7)';
  ctx.font = '600 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('Unlocked: ' + unlocked, W/2, headerH/2 + 14);

  ui.backBtn = { x:16, y:(headerH-38)/2, w:78, h:38, label:'BACK' };
  drawButton(ui.backBtn, true);
}

  const tabY = 92, tabH = 42, tabGap = 10, tabPadX = 16;
  const tabW = (W - tabPadX*2 - tabGap) / 2;
  shopUI.tabs.bgs   = { x: tabPadX,                 y: tabY, w: tabW, h: tabH, id:'bgs',   label:'BACKGROUNDS' };
  shopUI.tabs.tubes = { x: tabPadX + tabW + tabGap, y: tabY, w: tabW, h: tabH, id:'tubes', label:'TUBE SKINS'  };

  [shopUI.tabs.bgs, shopUI.tabs.tubes].forEach(tab => {
    const active = shopTab === tab.id;
    ctx.beginPath(); rr(ctx, tab.x, tab.y, tab.w, tab.h, 12);
    ctx.fillStyle = active ? 'rgba(74,168,255,0.32)' : 'rgba(255,255,255,0.06)';
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = active ? 'rgba(143,230,255,0.85)' : 'rgba(255,255,255,0.14)';
    ctx.stroke();
    ctx.fillStyle = active ? '#eaf2ff' : 'rgba(220,234,255,0.55)';
    ctx.font = '800 12.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(tab.label, tab.x + tab.w/2, tab.y + tab.h/2 + 1);
  });

  /* Grid */
  const items   = shopTab === 'bgs' ? SHOP_BGS : SHOP_TUBES;
  const gridTop = tabY + tabH + 22;
  const padX = 16, gap = 14;
  const cols  = W >= 480 ? 3 : 2;
  const cardW = (W - padX*2 - (cols-1)*gap) / cols;
  const cardH = Math.min(160, cardW * 1.05);

  shopUI.cards = [];
  items.forEach((item, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const x = padX + col*(cardW + gap);
    const y = gridTop + row*(cardH + gap);
    if (y + cardH > H - 12) return;

    const list     = shopTab === 'bgs' ? ownedBgs : ownedTubes;
    const activeId = shopTab === 'bgs' ? activeBg : activeTube;
    const owned    = list.includes(item.id);
    const equipped = activeId === item.id;

    ctx.beginPath(); rr(ctx, x, y, cardW, cardH, 16);
    ctx.fillStyle = equipped ? 'rgba(61,220,132,0.14)' : 'rgba(255,255,255,0.06)';
    ctx.fill();
    ctx.lineWidth = equipped ? 2 : 1.5;
    ctx.strokeStyle = equipped ? 'rgba(61,220,132,0.75)' : 'rgba(255,255,255,0.14)';
    ctx.stroke();

    /* preview */
    const prevH = cardH * 0.55;
    const prevX = x + 10, prevY = y + 10, prevW = cardW - 20;
    ctx.save();
    ctx.beginPath(); rr(ctx, prevX, prevY, prevW, prevH, 10);
    ctx.clip();

    if (shopTab === 'bgs') {
      const g = ctx.createLinearGradient(0, prevY, 0, prevY + prevH);
      g.addColorStop(0,    item.colors[0]);
      g.addColorStop(0.55, item.colors[1]);
      g.addColorStop(1,    item.colors[2]);
      ctx.fillStyle = g;
      ctx.fillRect(prevX, prevY, prevW, prevH);
    } else {
      ctx.fillStyle = '#0b1220';
      ctx.fillRect(prevX, prevY, prevW, prevH);
      const tw  = Math.min(prevW * 0.28, prevH * 0.30);
      const th  = tw * 3;
      const tcx = prevX + prevW/2, tcy = prevY + prevH/2;
      const tx = tcx - tw/2, ty = tcy - th/2;
      const trad = Math.min(tw*0.34, 10);

      ctx.beginPath(); rr(ctx, tx, ty, tw, th, trad);
      ctx.fillStyle = item.fill; ctx.fill();

      ctx.save();
      ctx.beginPath(); rr(ctx, tx, ty, tw, th, trad); ctx.clip();
      const bandH = th / 4;
      ctx.fillStyle = HEX['blue']   || '#0a84ff';
      ctx.fillRect(tx, ty + bandH*2, tw, bandH*2);
      ctx.fillStyle = HEX['yellow'] || '#ffd60a';
      ctx.fillRect(tx, ty + bandH,   tw, bandH);
      ctx.fillStyle = HEX['red']    || '#ff3b30';
      ctx.fillRect(tx, ty,           tw, bandH);
      ctx.restore();

      ctx.beginPath(); rr(ctx, tx, ty, tw, th, trad);
      ctx.lineWidth = 2.5; ctx.strokeStyle = item.border; ctx.stroke();
    }
    ctx.restore();

    /* name */
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#eaf2ff';
    ctx.font = '800 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.fillText(item.name, x + 14, y + prevH + 26);

    /* status */
    const statusY = y + cardH - 22;
    if (equipped) {
      ctx.fillStyle = '#3ddc84';
      ctx.font = '800 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('EQUIPPED', x + 14, statusY);
    } else if (owned) {
      ctx.fillStyle = 'rgba(143,230,255,0.9)';
      ctx.font = '800 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('TAP TO EQUIP', x + 14, statusY);
    } else {
      const r = 8;
      drawCoinIcon(ctx, x + 14 + r, statusY, r);
      const affordable = coins >= item.cost;
      ctx.fillStyle = affordable ? '#ffe066' : '#ff6b6b';
      ctx.font = '800 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(String(item.cost), x + 14 + r*2 + 8, statusY);
    }

    shopUI.cards.push({ x, y, w:cardW, h:cardH, item, owned, equipped });
  });
}

function drawPlaying() {
  const W = view.w, H = view.h;
  ctx.fillStyle = bgGradient || '#0b1220';
  ctx.fillRect(0, 0, W, H);
  drawHUD();

  ui.backBtn = { x:16, y:(72-34)/2 + 4, w:62, h:34, label:'MENU' };
  drawButton(ui.backBtn, !won);

  for (let i = 0; i < tubes.length; i++) drawTube(i);
  drawStream();

  if (layout.coinBar) drawCoinPill(layout.coinBar.x, layout.coinBar.y, layout.coinBar.w, layout.coinBar.h);
  drawBarButton(layout.hintBtn,  'hint', 'HINT', String(HINT_COST), !won, coins >= HINT_COST);
  drawBarButton(layout.extraBtn, 'tube', 'TUBE', String(TUBE_COST), !won && tubes.length < MAX_TUBES, coins >= TUBE_COST);

  if (won) drawWinOverlay();
}

function drawToast() {
  if (!toast) return;
  const a = Math.min(1, toast.t / 170) * Math.min(1, (toast.dur - toast.t) / 300);
  const W = view.w;
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, a));
  ctx.font = '700 13.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const tw = ctx.measureText(toast.text).width;
  const pw = Math.min(W - 32, tw + 36), ph = 40;
  const px = (W - pw) / 2;

  let py;
  if (gameState === 'PLAYING' && layout.hintBtn) {
    py = layout.hintBtn.y - ph - 16;
  } else {
    py = view.h - ph - 80;
  }
  py = Math.max(86, Math.min(py, view.h - ph - 20));

  ctx.beginPath(); rr(ctx, px, py, pw, ph, 20);
  ctx.fillStyle = 'rgba(10,18,32,0.94)'; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(160,210,255,0.45)'; ctx.stroke();

  ctx.fillStyle = '#eaf2ff';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(toast.text, W/2, py + ph/2 + 1, pw - 26);
  ctx.restore();
}

function render() {
  if (gameState === 'MENU')        drawMainMenu();
  else if (gameState === 'LEVELS') drawLevelMap();
  else if (gameState === 'SHOP')   drawShop();
  else                             drawPlaying();
  drawParticles();
  if (gameState === 'PLAYING' || gameState === 'SHOP') drawToast();
}

/* ---------- 11. UPDATE / LOOP ---------- */
function update(dt) {
  if (anim) {
    anim.elapsed += dt;
    const raw = Math.min(1, anim.elapsed / anim.dur);
    anim.p = easeInOutQuad(raw);
    if (raw >= 1) { anim = null; checkWin(); }
  }
  if (shakeT > 0) {
    shakeT = Math.max(0, shakeT - dt);
    if (shakeT === 0) shakeIndex = -1;
  }
  if (won && winProgress < 1) winProgress = Math.min(1, winProgress + dt/320);
  if (won && coinRewardT < 1) coinRewardT = Math.min(1, coinRewardT + dt/900);

  if (hint) { hint.t -= dt; if (hint.t <= 0) hint = null; }
  if (toast) { toast.t += dt; if (toast.t >= toast.dur) toast = null; }

  updateParticles(dt);
}

let lastTime = 0;
function loop(now) {
  const dt = lastTime ? Math.min(50, now - lastTime) : 16;
  lastTime = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

/* ---------- 12. RESIZE / BOOT ---------- */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  view.w = window.innerWidth  || document.documentElement.clientWidth  || 360;
  view.h = window.innerHeight || document.documentElement.clientHeight || 640;
  view.dpr = dpr;

  canvas.width  = Math.max(1, Math.floor(view.w * dpr));
  canvas.height = Math.max(1, Math.floor(view.h * dpr));
  canvas.style.width  = view.w + 'px';
  canvas.style.height = view.h + 'px';

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  /* Build bgGradient from the equipped theme */
  applyActiveBg();

  computeLayout();
}

/* Boot */
loadShopProgress();          // MUST be before resize() so we build the right bg

gameState = 'MENU';
startLevel(level);
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
requestAnimationFrame(loop);

console.log('[WaterSort] Booted. Menu first. Unlocked level ' + getUnlocked() +
            ' · Coins ' + coins +
            ' · Active BG: ' + activeBg +
            ' · Active Tube: ' + activeTube);

})();
</script>
