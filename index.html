<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0b1220" />
<title>Water Sort Puzzle</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      -webkit-user-select:none; user-select:none; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#080d16;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    touch-action:none; overscroll-behavior:none;
  }
  #game { display:block; width:100%; height:100%; touch-action:none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
(() => {
'use strict';

/* ---------- 1. CANVAS ---------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const view = { w:0, h:0, dpr:1 };
let bgGradient = null;

/* ---------- 2. CONSTANTS ---------- */
const CAP = 4;
const SHAKE_DUR = 320;
const TOTAL_LEVELS = 100;
const COLORS = [
  { key:'red',    hex:'#ff3b30' },
  { key:'green',  hex:'#34c759' },
  { key:'blue',   hex:'#0a84ff' },
  { key:'yellow', hex:'#ffd60a' },
  { key:'purple', hex:'#bf5af2' },
  { key:'orange', hex:'#ff9f0a' },
  { key:'cyan',   hex:'#40c8e0' },
  { key:'pink',   hex:'#ff375f' },
  { key:'lime',   hex:'#a3e635' }
];
/* Safer than Object.fromEntries — works everywhere */
const HEX = {};
COLORS.forEach(c => { HEX[c.key] = c.hex; });

/* ---------- 3. STATE ---------- */
/* Load saved progress on boot. Wrapped in try/catch because localStorage can
   throw (private mode / blocked cookies / file:// in some browsers). */
let level = (() => {
  try {
    const saved = parseInt(localStorage.getItem('watersort_level'), 10);
    return (Number.isFinite(saved) && saved >= 1) ? saved : 1;
  } catch (e) { return 1; }
})();

/* Music preference (default ON). Saved under 'watersort_music'. */
let musicEnabled = (() => {
  try {
    const v = localStorage.getItem('watersort_music');
    return v === null ? true : (v === 'true' || v === '1');
  } catch (e) { return true; }
})();

let gameState = 'MENU';          // 'MENU', 'LEVELS', 'PLAYING'
let mapScroll = 0;               // level map scroll offset
let mapMaxScroll = 0;
let mapAutoScroll = false;       // LEVELS kholte waqt current level par scroll

let tubes = [];
let initialTubes = [];
let history = [];
let selected = -1;
let moves = 0;
let won = false;
let winProgress = 0;
let anim = null;
let shakeT = 0;
let shakeIndex = -1;
let particles = [];              // confetti particles

const layout = { tubes:[], undoBtn:null, resetBtn:null, nextBtn:null, musicBtn:null };
const ui = { playBtn:null, levelsBtn:null, backBtn:null, menuBtn:null, musicBtn:null, cells:[] };

/* Saved progress = highest unlocked level */
function getUnlocked() {
  try {
    const s = parseInt(localStorage.getItem('watersort_level'), 10);
    return (Number.isFinite(s) && s >= 1) ? s : 1;
  } catch (e) { return 1; }
}
function saveProgress() {
  const nxt = level + 1;
  if (nxt > getUnlocked()) {
    try { localStorage.setItem('watersort_level', String(nxt)); } catch (e) {}
  }
}

/* ---------- 4. HELPERS ---------- */
const cloneTubes = arr => arr.map(t => t.slice());

function rr(c, x, y, w, h, r) {
  if (typeof c.roundRect === 'function') { c.roundRect(x, y, w, h, r); return; }
  r = Math.min(r, w/2, h/2);
  c.moveTo(x+r, y);
  c.arcTo(x+w, y,   x+w, y+h, r);
  c.arcTo(x+w, y+h, x,   y+h, r);
  c.arcTo(x,   y+h, x,   y,   r);
  c.arcTo(x,   y,   x+w, y,   r);
  c.closePath();
}
const easeInOutQuad = t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
function pointInRect(p, r) {
  return !!r && p.x >= r.x && p.x <= r.x+r.w && p.y >= r.y && p.y <= r.y+r.h;
}

/* Haptic feedback — safe on browsers without vibration support */
function vibrate(pattern) {
  if (navigator.vibrate) {
    try { navigator.vibrate(pattern); } catch (e) {}
  }
}

/* ---------- 5. LEVEL GEN ---------- */
function colorsForLevel(lv) { return Math.min(4 + (lv-1), COLORS.length); }

function shuffle(a) {
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function isTriviallySorted(pool, nColors) {
  for (let i = 0; i < nColors; i++) {
    const s = i * CAP;
    for (let k = 1; k < CAP; k++) if (pool[s+k] !== pool[s]) return false;
  }
  return true;
}
function generateTubes(lv) {
  const nColors = colorsForLevel(lv);
  const pool = [];
  for (let i = 0; i < nColors; i++) for (let k = 0; k < CAP; k++) pool.push(COLORS[i].key);

  let guard = 0;
  do { shuffle(pool); } while (isTriviallySorted(pool, nColors) && ++guard < 40);

  const out = [];
  for (let i = 0; i < nColors; i++) out.push(pool.slice(i*CAP, i*CAP+CAP));
  out.push([], []);
  return out;
}

/* ---------- 6. LAYOUT ---------- */
function computeLayout() {
  const W = view.w, H = view.h;
  if (W === 0 || H === 0) return;

  const HUD_H = 72, PAD_X = 16, BOT_PAD = 26;
  const areaTop = HUD_H + 6;
  const areaH = H - areaTop - BOT_PAD;
  const areaW = W - PAD_X*2;

  const n = tubes.length;
  const rows = n <= 5 ? 1 : 2;
  const perRow = Math.ceil(n / rows);
  const gapX = Math.max(9, Math.min(20, areaW*0.025));

  const maxTubeW = (areaW - (perRow-1)*gapX) / perRow;
  const rowH = areaH / rows;
  const maxTubeH = rowH * 0.84;

  let tw = Math.min(maxTubeW, maxTubeH/3.6, 92);
  tw = Math.max(tw, 22);
  const th = tw * 3.6;

  layout.tubes = [];
  for (let r = 0; r < rows; r++) {
    const start = r*perRow;
    const end = Math.min(start + perRow, n);
    const count = end - start;
    if (count <= 0) continue;
    const totalW = count*tw + (count-1)*gapX;
    const startX = (W - totalW)/2;
    const centerY = areaTop + rowH*(r + 0.5);
    const y = centerY - th/2;
    for (let i = 0; i < count; i++) {
      layout.tubes.push({ x: startX + i*(tw+gapX), y, w: tw, h: th });
    }
  }

  /* HUD buttons (top right): [UNDO] [RESET] [music] */
  const btnH = 34, btnW = 56, btnGap = 6, hudPad = 12, musicW = 34;
  const btnY = (HUD_H - btnH)/2 + 4;
  layout.musicBtn = { x: W - hudPad - musicW,                          y: btnY, w: musicW, h: btnH };
  layout.resetBtn = { x: layout.musicBtn.x - btnGap - btnW,            y: btnY, w: btnW,   h: btnH, label:'RESET' };
  layout.undoBtn  = { x: layout.resetBtn.x - btnGap - btnW,            y: btnY, w: btnW,   h: btnH, label:'UNDO'  };
}

/* ---------- 7. GAME LOGIC ---------- */
function startLevel(lv) {
  level = lv;
  tubes = generateTubes(lv);
  initialTubes = cloneTubes(tubes);
  history = [];
  selected = -1; anim = null; won = false; winProgress = 0; moves = 0;
  shakeT = 0; shakeIndex = -1;
  particles = [];
  if (view.w > 0) computeLayout();
}

function topRunLength(tube) {
  if (!tube.length) return 0;
  const c = tube[tube.length-1];
  let n = 1;
  for (let i = tube.length-2; i >= 0; i--) { if (tube[i] === c) n++; else break; }
  return n;
}
function isTubeComplete(t) {
  if (t.length !== CAP) return false;
  for (let i = 1; i < CAP; i++) if (t[i] !== t[0]) return false;
  return true;
}
function canPour(src, dst) {
  if (src === dst) return false;
  const s = tubes[src], d = tubes[dst];
  if (!s || !d) return false;
  if (!s.length) return false;
  if (d.length >= CAP) return false;
  if (isTubeComplete(s)) return false;
  if (!d.length) return true;
  return d[d.length-1] === s[s.length-1];
}
function doPour(src, dst) {
  const s = tubes[src], d = tubes[dst];
  const color = s[s.length-1];
  const amount = Math.min(topRunLength(s), CAP - d.length);
  if (amount <= 0) return;

  history.push({ tubes: cloneTubes(tubes), moves });
  if (history.length > 120) history.shift();

  for (let i = 0; i < amount; i++) s.pop();
  for (let i = 0; i < amount; i++) d.push(color);
  moves++;

  anim = { from:src, to:dst, color, amount, elapsed:0, dur:380, p:0 };
  playPour();
  vibrate(20);                                   // valid pour
}
function isWin() {
  for (const t of tubes) {
    if (!t.length) continue;
    if (t.length !== CAP) return false;
    for (let i = 1; i < t.length; i++) if (t[i] !== t[0]) return false;
  }
  return true;
}
function checkWin() {
  if (isWin()) {
    won = true; winProgress = 0; saveProgress(); playWin();
    spawnConfetti();
    vibrate([100, 50, 100, 50, 300]);            // celebration pattern
  }
}
function doUndo() {
  if (won || anim) return;
  if (!history.length) { buzz(); return; }
  const snap = history.pop();
  tubes = snap.tubes; moves = snap.moves; selected = -1; anim = null;
  playSelect();
}
function doReset() {
  if (anim) return;
  tubes = cloneTubes(initialTubes);
  history = []; selected = -1; won = false; winProgress = 0; moves = 0; shakeT = 0;
  particles = [];
  playSelect();
}
function nextLevel() {
  startLevel(level + 1);
}

/* ---------- 7b. CONFETTI ---------- */
const CONFETTI_COLORS = COLORS.map(c => c.hex).concat(['#ffffff', '#ffd700', '#ff69b4']);

function spawnConfetti() {
  const W = view.w, H = view.h;
  const count = 100 + Math.floor(Math.random() * 51);   // 100–150
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * W,
      y: -10 - Math.random() * H * 0.45,                 // staggered above the screen
      vx: (Math.random() - 0.5) * 140,                   // px/s
      vy: 60 + Math.random() * 180,                      // px/s
      size: 6 + Math.random() * 7,
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
      shape: Math.random() < 0.55 ? 'square' : 'circle',
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 9,                     // rad/s
      tilt: Math.random() * Math.PI * 2,
      vt: 3 + Math.random() * 5,                         // flutter speed
      sway: Math.random() * Math.PI * 2,
      swayV: 1.5 + Math.random() * 2.5
    });
  }
}

function updateParticles(dt) {
  if (!particles.length) return;
  const s = dt / 1000, H = view.h;
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vy += 330 * s;                         // gravity
    if (p.vy > 420) p.vy = 420;              // terminal velocity (paper-like)
    p.sway += p.swayV * s;
    p.x += (p.vx + Math.sin(p.sway) * 40) * s;
    p.y += p.vy * s;
    p.rot += p.vr * s;
    p.tilt += p.vt * s;
    if (p.y > H + 20) particles.splice(i, 1);
  }
}

function drawParticles() {
  if (!particles.length) return;
  ctx.save();
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    if (p.shape === 'circle') {
      ctx.beginPath(); ctx.arc(0, 0, p.size * 0.45, 0, Math.PI * 2); ctx.fill();
    } else {
      const flip = Math.max(0.2, Math.abs(Math.cos(p.tilt)));   // flutter effect
      ctx.fillRect(-p.size/2, -p.size*flip/2, p.size, p.size*flip);
    }
    ctx.restore();
  }
  ctx.restore();
}

/* ---------- 8. INPUT ---------- */
function getPointerPos(e) {
  const rect = canvas.getBoundingClientRect();
  const p = (e.touches && e.touches[0]) ? e.touches[0]
          : (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0]
          : e;
  return { x: p.clientX - rect.left, y: p.clientY - rect.top };
}
function tubeAtPoint(p) {
  for (let i = 0; i < layout.tubes.length; i++) {
    const r = layout.tubes[i];
    if (p.x >= r.x-7 && p.x <= r.x+r.w+7 && p.y >= r.y-14 && p.y <= r.y+r.h+10) return i;
  }
  return -1;
}
function toggleMusic() {
  musicEnabled = !musicEnabled;
  try { localStorage.setItem('watersort_music', String(musicEnabled)); } catch (e) {}
  if (musicEnabled) { initAudio(); startBGM(); playSelect(); }
  else stopBGM();
}
function handleTap(p) {
  initAudio();
  if (musicEnabled) startBGM();     // first user gesture unlocks audio; no-op if already playing

  /* ---- MAIN MENU ---- */
  if (gameState === 'MENU') {
    if (pointInRect(p, ui.musicBtn)) { toggleMusic(); return; }
    if (pointInRect(p, ui.playBtn)) {
      playSelect();
      gameState = 'PLAYING';
      startLevel(getUnlocked());          // continue from highest unlocked level
    } else if (pointInRect(p, ui.levelsBtn)) {
      playSelect();
      gameState = 'LEVELS';
      mapAutoScroll = true;
    }
    return;
  }

  /* ---- LEVEL MAP ---- */
  if (gameState === 'LEVELS') {
    if (pointInRect(p, ui.backBtn)) { playSelect(); gameState = 'MENU'; return; }
    if (p.y < 76) return;                 // header ke neeche chhupe cells ignore
    for (let i = 0; i < ui.cells.length; i++) {
      if (pointInRect(p, ui.cells[i])) {
        playSelect();
        gameState = 'PLAYING';
        startLevel(ui.cells[i].lv);
        return;
      }
    }
    return;
  }

  /* ---- PLAYING ---- */
  if (pointInRect(p, layout.musicBtn)) { toggleMusic(); return; }
  if (won) {
    if (pointInRect(p, layout.nextBtn)) { nextLevel(); return; }
    if (pointInRect(p, ui.menuBtn))     { particles = []; gameState = 'MENU'; return; }
    return;
  }
  if (pointInRect(p, ui.backBtn)) {
    anim = null; selected = -1;
    gameState = 'MENU';
    return;
  }
  if (anim) return;
  if (pointInRect(p, layout.undoBtn))  { doUndo();  return; }
  if (pointInRect(p, layout.resetBtn)) { doReset(); return; }

  const idx = tubeAtPoint(p);
  if (idx < 0) { selected = -1; return; }

  if (selected === -1) {
    if (!tubes[idx].length) return;
    selected = idx; playSelect(); vibrate(10); return;     // light tap
  }
  if (selected === idx) { selected = -1; return; }

  if (canPour(selected, idx)) {
    doPour(selected, idx); selected = -1;
  } else {
    buzz();                                                // also vibrates (invalid move)
    shakeT = SHAKE_DUR; shakeIndex = idx;
    selected = tubes[idx].length > 0 ? idx : -1;
  }
}

/* Pointer events: LEVELS screen par drag = scroll, tap = select.
   Baaki screens par tap foran register hota hai. */
let ptr = null;

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  const p = getPointerPos(e);
  if (gameState === 'LEVELS') {
    ptr = { startY:p.y, lastY:p.y, moved:false };
  } else {
    handleTap(p);
  }
});
canvas.addEventListener('pointermove', e => {
  if (!ptr) return;
  const p = getPointerPos(e);
  if (!ptr.moved && Math.abs(p.y - ptr.startY) > 8) ptr.moved = true;
  if (ptr.moved) {
    mapScroll = Math.max(0, Math.min(mapScroll - (p.y - ptr.lastY), mapMaxScroll));
  }
  ptr.lastY = p.y;
});
canvas.addEventListener('pointerup', e => {
  if (ptr && !ptr.moved && gameState === 'LEVELS') handleTap(getPointerPos(e));
  ptr = null;
});
canvas.addEventListener('pointercancel', () => { ptr = null; });
canvas.addEventListener('wheel', e => {
  if (gameState !== 'LEVELS') return;
  e.preventDefault();
  mapScroll = Math.max(0, Math.min(mapScroll + e.deltaY, mapMaxScroll));
}, { passive:false });
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- 9. AUDIO ---------- */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) { try { audioCtx = new AC(); } catch(_) {} }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, dur, type='sine', vol=0.05, slideTo=null) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, now);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), now+dur);
  g.gain.setValueAtTime(vol, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now+dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(now); osc.stop(now+dur+0.02);
}
const playSelect = () => tone(760, 0.07, 'sine', 0.035);
const playPour   = () => tone(620, 0.18, 'sine', 0.045, 250);
const buzz       = () => { tone(150, 0.15, 'square', 0.045, 110); vibrate([50, 50, 50]); };
function playWin() {
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
    setTimeout(() => tone(f, 0.24, 'sine', 0.06), i*110));
}

/* ----- Background music: soft synthwave/ambient loop (Am – F – C – G) ----- */
const BGM_STEP  = 0.26;                                  // seconds per step (16 steps = 1 loop)
const BGM_BASS  = [55, 43.65, 65.41, 49];                // A1, F1, C2, G1 — one per chord (4 steps)
const BGM_ARP   = [
  [220.00, 261.63, 329.63, 261.63],                      // Am
  [174.61, 220.00, 261.63, 220.00],                      // F
  [261.63, 329.63, 392.00, 329.63],                      // C
  [196.00, 246.94, 293.66, 246.94]                       // G
];
const BGM_MELODY = [659.25,0,523.25,0, 523.25,0,440,0, 523.25,0,659.25,0, 587.33,0,493.88,0];
let bgmGain = null, bgmTimer = null, bgmStep = 0, bgmNext = 0;

function bgmNote(freq, t, dur, type, vol) {
  if (!audioCtx || !bgmGain) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(bgmGain);
  o.start(t); o.stop(t + dur + 0.05);
}
function bgmSchedule(step, t) {
  const chord = Math.floor(step / 4), inChord = step % 4;
  if (inChord === 0 || inChord === 2) bgmNote(BGM_BASS[chord], t, BGM_STEP*2*0.95, 'triangle', 0.14);   // bass
  bgmNote(BGM_ARP[chord][inChord], t, BGM_STEP*1.2, 'sine', 0.03);                                       // soft arp
  if (BGM_MELODY[step]) bgmNote(BGM_MELODY[step], t, BGM_STEP*2.2, 'sine', 0.05);                        // melody
}
function bgmTick() {
  if (!audioCtx || !bgmGain) return;
  const now = audioCtx.currentTime;
  if (bgmNext < now) bgmNext = now + 0.05;               // catch up if timer was throttled
  while (bgmNext < now + 0.3) {
    bgmSchedule(bgmStep, bgmNext);
    bgmNext += BGM_STEP;
    bgmStep = (bgmStep + 1) % 16;
  }
}
function startBGM() {
  if (!musicEnabled) return;
  initAudio();
  if (!audioCtx || bgmTimer) return;
  bgmGain = audioCtx.createGain();
  const now = audioCtx.currentTime;
  bgmGain.gain.setValueAtTime(0.0001, now);
  bgmGain.gain.linearRampToValueAtTime(0.6, now + 0.8);  // fade in
  bgmGain.connect(audioCtx.destination);
  bgmStep = 0;
  bgmNext = now + 0.1;
  bgmTimer = setInterval(bgmTick, 90);
  bgmTick();
}
function stopBGM() {
  if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
  if (bgmGain && audioCtx) {
    const g = bgmGain, now = audioCtx.currentTime;
    try {
      g.gain.cancelScheduledValues(now);
      g.gain.setValueAtTime(Math.max(0.0001, g.gain.value), now);
      g.gain.linearRampToValueAtTime(0.0001, now + 0.25);   // fade out
    } catch (e) {}
    setTimeout(() => { try { g.disconnect(); } catch (e) {} }, 450);
  }
  bgmGain = null;
}
/* Pause audio when the tab/app goes to background */
document.addEventListener('visibilitychange', () => {
  if (!audioCtx) return;
  try {
    if (document.hidden) audioCtx.suspend();
    else audioCtx.resume();
  } catch (e) {}
});

/* ---------- 10. RENDER ---------- */
function getDisplay(i) {
  const t = tubes[i];
  if (!anim) return { colors: t, frac: 0, fracColor: null };

  if (i === anim.from) {
    const remaining = anim.amount * (1 - anim.p);
    const full = Math.floor(remaining);
    const frac = remaining - full;
    return {
      colors: t.concat(new Array(full).fill(anim.color)),
      frac, fracColor: anim.color
    };
  }
  if (i === anim.to) {
    const shown = anim.amount * anim.p;
    const full  = Math.floor(shown);
    const base  = t.slice(0, t.length - anim.amount);
    return {
      colors: base.concat(new Array(full).fill(anim.color)),
      frac: shown - full, fracColor: anim.color
    };
  }
  return { colors: t, frac: 0, fracColor: null };
}

function drawHUD() {
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#eaf2ff';
  ctx.font = '800 18px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('LEVEL ' + level, 88, 30);

  ctx.fillStyle = 'rgba(180,200,225,0.65)';
  ctx.font = '600 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('MOVES  ' + moves, 88, 52);

  drawButton(layout.undoBtn, history.length > 0 && !won);
  drawButton(layout.resetBtn, !won);
  drawMusicBtn(layout.musicBtn);
}
function drawButton(b, enabled) {
  if (!b) return;
  ctx.save();
  ctx.beginPath(); rr(ctx, b.x, b.y, b.w, b.h, 11);
  ctx.fillStyle = enabled ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.05)';
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = enabled ? 'rgba(160,210,255,0.45)' : 'rgba(255,255,255,0.14)';
  ctx.stroke();
  ctx.fillStyle = enabled ? '#dceaff' : 'rgba(220,234,255,0.32)';
  ctx.font = '700 12.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(b.label, b.x + b.w/2, b.y + b.h/2 + 0.5);
  ctx.restore();
}
function drawMusicBtn(b) {
  if (!b) return;
  ctx.save();
  ctx.beginPath(); rr(ctx, b.x, b.y, b.w, b.h, 11);
  ctx.fillStyle = musicEnabled ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.05)';
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = musicEnabled ? 'rgba(160,210,255,0.45)' : 'rgba(255,255,255,0.14)';
  ctx.stroke();
  ctx.font = Math.round(b.h*0.5) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(musicEnabled ? '🔊' : '🔇', b.x + b.w/2, b.y + b.h/2 + 1);
  ctx.restore();
}

function drawTube(i) {
  const r = layout.tubes[i]; if (!r) return;
  const disp = getDisplay(i);
  const isSel = (selected === i) && !anim;

  let ox = 0, oy = 0;
  if (shakeT > 0 && shakeIndex === i) ox = Math.sin(shakeT*0.09)*9*(shakeT/SHAKE_DUR);
  if (isSel) oy = -10;
  if (anim && anim.from === i) oy = -Math.sin(anim.p*Math.PI)*r.h*0.10;

  const x = r.x + ox, y = r.y + oy, w = r.w, h = r.h;
  const radius = Math.min(w*0.34, 20);
  const wall = Math.max(3, w*0.075);

  ctx.beginPath(); rr(ctx, x, y, w, h, radius);
  ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fill();

  ctx.save();
  ctx.beginPath();
  rr(ctx, x+wall, y+wall, w-2*wall, h-2*wall, Math.max(1, radius-wall));
  ctx.clip();

  const innerX = x + wall, innerW = w - 2*wall;
  const innerBottom = y + h - wall;
  const topGap = w * 0.09;
  const unitH = (h - 2*wall - topGap) / CAP;

  let cy = innerBottom;
  for (let k = 0; k < disp.colors.length; k++) {
    cy -= unitH;
    ctx.fillStyle = HEX[disp.colors[k]] || '#888888';
    ctx.fillRect(innerX, cy, innerW, unitH + 0.6);
  }
  if (disp.frac > 0.002 && disp.fracColor) {
    const fh = unitH * Math.min(1, disp.frac);
    ctx.fillStyle = HEX[disp.fracColor] || '#888888';
    ctx.fillRect(innerX, cy - fh, innerW, fh + 0.6);
  }
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  ctx.fillRect(innerX + innerW*0.12, y+wall, Math.max(3, innerW*0.14), h-2*wall);
  ctx.restore();

  ctx.beginPath(); rr(ctx, x, y, w, h, radius);
  if (isSel) {
    ctx.shadowColor = 'rgba(120,220,255,0.95)';
    ctx.shadowBlur = 18;
    ctx.lineWidth = 3; ctx.strokeStyle = '#8fe6ff';
  } else {
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(200,225,255,0.48)';
  }
  ctx.stroke();
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
}

function drawStream() {
  if (!anim) return;
  const from = layout.tubes[anim.from], to = layout.tubes[anim.to];
  if (!from || !to) return;
  const liftFrom = -Math.sin(anim.p*Math.PI)*from.h*0.10;
  const sx = from.x + from.w/2, sy = from.y + liftFrom + from.h*0.09;
  const tx = to.x + to.w/2, ty = to.y + to.h*0.10;
  const cx = (sx+tx)/2, cy = Math.min(sy, ty) - Math.max(50, from.h*0.35);
  ctx.save();
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(cx, cy, tx, ty);
  ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(6, from.w*0.45);
  ctx.strokeStyle = HEX[anim.color] || '#ffffff';
  ctx.globalAlpha = 0.92;
  ctx.stroke(); ctx.restore();
}

function drawWinOverlay() {
  const W = view.w, H = view.h, a = winProgress;
  ctx.save();
  ctx.globalAlpha = 0.80 * a;
  ctx.fillStyle = '#050a14';
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = a;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  const pop = 1 + (1-a)*0.18;
  ctx.save(); ctx.translate(W/2, H/2 - 86); ctx.scale(pop, pop);
  ctx.fillStyle = '#ffffff';
  ctx.font = '800 30px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('LEVEL COMPLETE!', 0, 0);
  ctx.restore();

  ctx.fillStyle = 'rgba(190,215,240,0.8)';
  ctx.font = '600 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('Level ' + level + ' solved in ' + moves + ' moves', W/2, H/2 - 40);

  const bw = Math.min(240, W*0.66), bh = 56;

  /* NEXT LEVEL */
  layout.nextBtn = { x:(W-bw)/2, y:H/2 + 6, w:bw, h:bh };
  const g = ctx.createLinearGradient(0, layout.nextBtn.y, 0, layout.nextBtn.y + bh);
  g.addColorStop(0, '#3ddc84'); g.addColorStop(1, '#1fae63');
  ctx.beginPath(); rr(ctx, layout.nextBtn.x, layout.nextBtn.y, bw, bh, 16);
  ctx.fillStyle = g; ctx.fill();
  ctx.fillStyle = '#04220f';
  ctx.font = '800 16px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('NEXT LEVEL', W/2, layout.nextBtn.y + bh/2 + 1);

  /* MENU */
  ui.menuBtn = { x:(W-bw)/2, y:H/2 + 6 + bh + 14, w:bw, h:48 };
  ctx.beginPath(); rr(ctx, ui.menuBtn.x, ui.menuBtn.y, bw, ui.menuBtn.h, 14);
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(160,210,255,0.45)'; ctx.stroke();
  ctx.fillStyle = '#dceaff';
  ctx.font = '700 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('MENU', W/2, ui.menuBtn.y + ui.menuBtn.h/2 + 1);

  ctx.restore();
}

/* ----- Menu / Level map drawing ----- */
function drawBigButton(b, label, c1, c2, textColor) {
  const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.save();
  ctx.beginPath(); rr(ctx, b.x, b.y, b.w, b.h, 18);
  ctx.fillStyle = g; ctx.fill();
  ctx.fillStyle = textColor;
  ctx.font = '800 20px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, b.x + b.w/2, b.y + b.h/2 + 1);
  ctx.restore();
}

function drawMainMenu() {
  const W = view.w, H = view.h;
  ctx.fillStyle = bgGradient || '#0b1220';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  /* Title */
  ctx.save();
  ctx.fillStyle = '#eaf2ff';
  ctx.shadowColor = 'rgba(64,200,224,0.65)';
  ctx.shadowBlur = 22;
  ctx.font = '900 ' + Math.min(52, W*0.13) + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('WATER SORT', W/2, H*0.20);
  ctx.restore();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(180,200,225,0.7)';
  ctx.font = '700 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('P U Z Z L E', W/2, H*0.20 + Math.min(52, W*0.13)*0.75);

  /* Decorative color dots */
  const dotR = 9, dotGap = 12;
  const rowW = COLORS.length*(dotR*2) + (COLORS.length-1)*dotGap;
  let dx = (W - rowW)/2 + dotR;
  for (let i = 0; i < COLORS.length; i++) {
    ctx.beginPath(); ctx.arc(dx, H*0.31, dotR, 0, Math.PI*2);
    ctx.fillStyle = COLORS[i].hex; ctx.fill();
    dx += dotR*2 + dotGap;
  }

  /* Buttons */
  const bw = Math.min(260, W*0.7), bh = 60;
  ui.playBtn   = { x:(W-bw)/2, y:H*0.44,         w:bw, h:bh };
  ui.levelsBtn = { x:(W-bw)/2, y:H*0.44 + bh+18, w:bw, h:bh };
  drawBigButton(ui.playBtn,   'PLAY',   '#3ddc84', '#1fae63', '#04220f');
  drawBigButton(ui.levelsBtn, 'LEVELS', '#4aa8ff', '#2a78d6', '#04162e');

  /* Music toggle (top right) */
  ui.musicBtn = { x: W - 16 - 46, y: 16, w: 46, h: 46 };
  drawMusicBtn(ui.musicBtn);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(180,200,225,0.55)';
  ctx.font = '600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('Level ' + getUnlocked() + ' reached', W/2, H*0.44 + bh*2 + 52);
}

function drawLock(cx, cy, s) {
  ctx.save();
  ctx.strokeStyle = ctx.fillStyle = 'rgba(200,215,235,0.35)';
  ctx.lineWidth = Math.max(2, s*0.12);
  ctx.beginPath(); ctx.arc(cx, cy - s*0.12, s*0.2, Math.PI, 0); ctx.stroke();
  ctx.beginPath(); rr(ctx, cx - s*0.3, cy - s*0.08, s*0.6, s*0.42, s*0.08); ctx.fill();
  ctx.restore();
}

function drawLevelMap() {
  const W = view.w, H = view.h;
  ctx.fillStyle = bgGradient || '#0b1220';
  ctx.fillRect(0, 0, W, H);

  const unlocked = getUnlocked();
  const cols = W >= 480 ? 5 : 4;
  const padX = 20, gap = 12, headerH = 76;
  const cell = Math.min(84, (W - padX*2 - (cols-1)*gap) / cols);
  const gridW = cols*cell + (cols-1)*gap;
  const startX = (W - gridW) / 2;
  const rows = Math.ceil(TOTAL_LEVELS / cols);
  const contentH = rows*(cell+gap) + 20;
  const viewH = H - headerH;

  mapMaxScroll = Math.max(0, contentH - viewH);
  if (mapAutoScroll) {
    const row = Math.floor((Math.min(unlocked, TOTAL_LEVELS) - 1) / cols);
    mapScroll = row*(cell+gap) - viewH/2 + cell/2;
    mapAutoScroll = false;
  }
  mapScroll = Math.max(0, Math.min(mapScroll, mapMaxScroll));

  ui.cells = [];
  ctx.save();
  ctx.beginPath(); ctx.rect(0, headerH, W, viewH); ctx.clip();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  for (let i = 1; i <= TOTAL_LEVELS; i++) {
    const r = Math.floor((i-1) / cols), c = (i-1) % cols;
    const x = startX + c*(cell+gap);
    const y = headerH + 10 + r*(cell+gap) - mapScroll;
    if (y + cell < headerH || y > H) continue;

    const open = i <= unlocked;
    const current = i === unlocked;

    ctx.beginPath(); rr(ctx, x, y, cell, cell, 16);
    if (current)   ctx.fillStyle = '#3ddc84';
    else if (open) ctx.fillStyle = 'rgba(74,168,255,0.22)';
    else           ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = current ? '#8fffc0' : open ? 'rgba(143,230,255,0.55)' : 'rgba(255,255,255,0.12)';
    ctx.stroke();

    if (open) {
      ctx.fillStyle = current ? '#04220f' : '#eaf2ff';
      ctx.font = '800 ' + Math.round(cell*0.34) + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(i), x + cell/2, y + cell/2 + 1);
      ui.cells.push({ x, y, w:cell, h:cell, lv:i });
    } else {
      drawLock(x + cell/2, y + cell/2, cell*0.5);
    }
  }
  ctx.restore();

  /* Header (solid background over the grid) */
  ctx.fillStyle = '#0e1626';
  ctx.fillRect(0, 0, W, headerH);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#eaf2ff';
  ctx.font = '800 20px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('SELECT LEVEL', W/2, headerH/2);

  ui.backBtn = { x:16, y:(headerH-38)/2, w:78, h:38, label:'BACK' };
  drawButton(ui.backBtn, true);
}

function drawPlaying() {
  const W = view.w, H = view.h;
  ctx.fillStyle = bgGradient || '#0b1220';
  ctx.fillRect(0, 0, W, H);
  drawHUD();

  ui.backBtn = { x:16, y:(72-34)/2 + 4, w:62, h:34, label:'MENU' };
  drawButton(ui.backBtn, !won);

  for (let i = 0; i < tubes.length; i++) drawTube(i);
  drawStream();
  if (won) drawWinOverlay();
}

function render() {
  if (gameState === 'MENU')        drawMainMenu();
  else if (gameState === 'LEVELS') drawLevelMap();
  else                             drawPlaying();
  drawParticles();                 // confetti on top of everything
}

/* ---------- 11. UPDATE / LOOP ---------- */
function update(dt) {
  if (anim) {
    anim.elapsed += dt;
    const raw = Math.min(1, anim.elapsed / anim.dur);
    anim.p = easeInOutQuad(raw);
    if (raw >= 1) { anim = null; checkWin(); }
  }
  if (shakeT > 0) {
    shakeT = Math.max(0, shakeT - dt);
    if (shakeT === 0) shakeIndex = -1;
  }
  if (won && winProgress < 1) winProgress = Math.min(1, winProgress + dt/320);
  updateParticles(dt);
}

let lastTime = 0;
function loop(now) {
  const dt = lastTime ? Math.min(50, now - lastTime) : 16;
  lastTime = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

/* ---------- 12. RESIZE / BOOT ---------- */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  view.w = window.innerWidth  || document.documentElement.clientWidth  || 360;
  view.h = window.innerHeight || document.documentElement.clientHeight || 640;
  view.dpr = dpr;

  canvas.width  = Math.max(1, Math.floor(view.w * dpr));
  canvas.height = Math.max(1, Math.floor(view.h * dpr));
  canvas.style.width  = view.w + 'px';
  canvas.style.height = view.h + 'px';

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  bgGradient = ctx.createLinearGradient(0, 0, 0, view.h);
  bgGradient.addColorStop(0,    '#182338');
  bgGradient.addColorStop(0.55, '#0e1626');
  bgGradient.addColorStop(1,    '#070c14');

  computeLayout();
}

/* Game ab MENU se start hota hai (gameState = 'MENU').
   startLevel(level) isliye rakha hai ke tubes[] khali na rahe. */
gameState = 'MENU';
startLevel(level);
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
requestAnimationFrame(loop);

console.log('[WaterSort] Booted. Menu first. Unlocked level ' + getUnlocked());

})();
</script>
